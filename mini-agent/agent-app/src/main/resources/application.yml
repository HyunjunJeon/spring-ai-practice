# mini-agent 기본 설정. provider 는 Spring profile 로 바꾼다: --spring.profiles.active=anthropic|openai|ollama
spring:
  application:
    name: mini-agent
  main:
    banner-mode: off
    web-application-type: none
  ai:
    chat:
      client:
        enabled: false
    model:
      # 어떤 provider 의 ChatModel 을 만들지 고르는 스위치. 프로필이 덮어쓴다.
      # 기본값 fake = plugin-fake-model 의 가짜 모델 (API 키 불필요).
      chat: fake
      # OpenAI starter 는 채팅 외에 embedding/image/audio/moderation 모델도 자동 구성한다.
      # 이 에이전트는 채팅만 쓰므로 나머지는 끈다. (켜 두면 그 모델들도 API 키를 요구한다)
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    mcp:
      client:
        # @McpSampling/@McpElicitation 같은 클라이언트 측 어노테이션을 쓰지 않으므로 스캐너를 끈다.
        # (켜 두면 "No sampling methods found" 경고가 뜬다)
        annotation-scanner:
          enabled: false
    tools:
      # 2.0.1 에 추가된 도구 호출 한도 (한 턴 기준). 기본값을 명시해 둔다.
      limits:
        max-calls-per-tool-default: 40
        max-total-tool-calls: 150
        # THROW 면 한도 초과 시 루프를 끊고 안내 메시지로 끝낸다.
        on-limit-exceeded: throw

logging:
  level:
    root: warn

agent:
  runs:
    wall: 30m
    tool-call-cap: 50
    # token-cap is optional; unknown usage is never a measured zero.
  models:
    default: fake/fake-scripted
    providers:
      openai:
        api-key: ${spring.ai.openai.api-key:${OPENAI_API_KEY:}}
        base-url: ${spring.ai.openai.base-url:${OPENAI_BASE_URL:https://api.openai.com/v1}}
        model: ${spring.ai.openai.chat.model:${OPENAI_MODEL:gpt-5-mini}}
        reasoning-effort: ${OPENAI_REASONING_EFFORT:}
      zai:
        api-key: ${ZAI_API_KEY:}
        base-url: ${ZAI_BASE_URL:https://api.z.ai/api/paas/v4}
        model: ${ZAI_MODEL:glm-5.3}
        max-tokens: 8192
        reasoning-effort: ${ZAI_REASONING_EFFORT:low}
        thinking: enabled
      anthropic:
        api-key: ${spring.ai.anthropic.api-key:${ANTHROPIC_API_KEY:}}
        base-url: ${spring.ai.anthropic.base-url:${ANTHROPIC_BASE_URL:https://api.anthropic.com}}
        model: ${spring.ai.anthropic.chat.model:${ANTHROPIC_MODEL:claude-sonnet-5-5}}
        max-tokens: ${spring.ai.anthropic.chat.max-tokens:4096}
      ollama:
        base-url: ${spring.ai.ollama.base-url:${OLLAMA_BASE_URL:http://localhost:11434}}
        model: ${spring.ai.ollama.chat.model:${OLLAMA_MODEL:qwen3:8b}}
  codex:
    model: ${CODEX_MODEL:gpt-6-luna}
    reasoning-effort: ${CODEX_REASONING_EFFORT:xhigh}
  claude:
    model: ${CLAUDE_MODEL:claude-sonnet-5-5}
    auth-store: ${agent.home:${user.home}/.mini-agent}/auth/claude.json
  # 대화형 화면: tui(전체 화면 + 트레이스 사이드바) | repl(줄 단위). 터미널이 아니면(파이프 입력) 자동으로 repl.
  ui: tui
  # 플러그인 on/off. 모듈 의존성은 그대로 두고 런타임에만 끈다.
  plugins:
    fs:
      enabled: true
      # 파일 도구는 작업 디렉터리와 ~/.mini-agent/skills 안에서만 동작한다. 더 열려면 절대 경로를 쉼표로 추가한다.
      # allowed-roots: /Users/me/notes
      max-read-bytes: 10MB
      # write_file·edit_file 전에 원본을 보관해 /undo 로 직전 턴을 되돌린다(같은 실행 안에서만).
      checkpoints: true
    bash:
      enabled: true
      timeout: 30s
      max-timeout: 300s
      max-output-chars: 20000
      max-output-bytes: 1048576
      # off | workspace-write (macOS 전용: 작업 폴더·임시 폴더·sandbox-writable-roots 밖 쓰기를 막는다).
      # ./mvnw 처럼 ~/.m2 에 쓰는 명령을 쓰려면 그 경로를 절대 경로로 추가한다.
      sandbox: "off"
      # sandbox-writable-roots: /Users/me/.m2
    permission:
      enabled: true
      # 확인 없이 실행할 도구. 그 밖의 도구(새 플러그인, MCP 포함)는 모두 실행 전에 묻는다. * 로 끝나면 접두어 일치.
      auto-allow-tools: read_file,list_dir,load_skill
      # [a]lways 를 골라도 같은 입력에만 적용할 도구.
      remember-exact-input: bash
    memory:
      enabled: true
      # 전체 기록은 append-only. 매 모델 라운드의 system/요약/기록/현재 USER·도구 그룹 모두를 센다.
      max-messages: 100
      max-context-chars: 200000
      # 요약 요청 전체(system/머리말/생략 표시 포함)와 저장·재사용할 요약 본문의 UTF-16 문자 상한.
      max-summary-request-chars: 32000
      max-summary-chars: 8000
      # 최근 부분 밖으로 밀려난 앞부분을 지금 쓰는 모델로 요약해 문맥 앞에 붙인다. 요약도 세션 파일에 남는다.
      compaction: true
    trace:
      enabled: true
      # off | summary(턴당 한 줄) | detail(라운드별 트리). 실행 중에는 /trace detail 로 바꾼다.
      level: summary
    skills:
      enabled: true
