# Java 가 OAuth 와 Messages API 를 직접 처리한다. API 키 프로필은 application-anthropic.yml.
spring:
  ai:
    model:
      chat: none

agent:
  models:
    default: claude/${agent.claude.model}
  claude:
    model: ${CLAUDE_MODEL:claude-sonnet-5-5}
    max-tokens: 4096
    auth-store: ${agent.home:${user.home}/.mini-agent}/auth/claude.json
    timeout: 120s
    oauth-timeout: 30s
    max-response-bytes: 8388608
    cli-version: ${CLAUDE_CLI_VERSION:2.1.289}
